version: 2

# Dependabot keeps pinned versions current — GitHub Actions SHAs / tags and
# Terraform provider + module constraints. PRs land like any other change:
# infra-plan.yml runs fmt/validate/lint/sec/plan, branch protection gates
# the merge.
#
# Terraform ecosystems ignore semver-major: a major bump of an upstream
# module (terraform-aws-modules vpc/eks/iam) carries renamed inputs and
# restructured outputs, and can force replacement of live infrastructure
# (an EKS cluster recreate). That is a deliberate, tested migration — not a
# routine auto-merge. Dependabot still proposes minor/patch.

# MAINTENANCE FREEZE (from 2026-07-31, expected to lift ~2027-Q1/Q2): the
# owner is starting a new job and won't be able to tend this repo for six
# months or more. Every entry below gets open-pull-requests-limit: 0 so
# Dependabot stops opening version-update PRs — a public repo with dozens of
# unattended bot PRs piling up reads worse than one with the cadence turned
# down deliberately. This does not touch security updates, which are a
# separate GitHub mechanism (repo Settings -> Code security -> Dependabot
# security updates) and keep firing regardless of this file. To resume,
# delete the open-pull-requests-limit line from each entry (default is 5).
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    open-pull-requests-limit: 0

  - package-ecosystem: terraform
    directory: /terraform/envs/bootstrap
    schedule:
      interval: weekly
    commit-message:
      prefix: "tf"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 0

  - package-ecosystem: terraform
    directory: /terraform/envs/platform
    schedule:
      interval: weekly
    commit-message:
      prefix: "tf"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 0

  - package-ecosystem: terraform
    directory: /terraform/envs/regional
    schedule:
      interval: weekly
    commit-message:
      prefix: "tf"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 0

  - package-ecosystem: terraform
    directory: /terraform/modules/regional-stack
    schedule:
      interval: weekly
    commit-message:
      prefix: "tf"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 0
