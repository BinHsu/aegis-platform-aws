name: e2e-golden-path

# NON-BILLABLE kind-in-CI E2E golden-path gate (epic #167 B1 / ADR-26; delivery
# inverted to GitOps in A2 / ADR-25 / #174). Mirrors crossplane-kind-integration.yml:
# stands up a real Kubernetes API server (kind) and brings up the SAME ArgoCD +
# Kyverno + aegis-policies stack the platform installs on EKS — with ZERO AWS
# creds, ZERO AWS calls, ZERO billable resources.
#
# DELIVERY: since A2 (#174) the policy stack arrives THROUGH ArgoCD (app-of-apps
# root → kyverno wave 0 → aegis-policies wave 1), NOT through a direct `helm
# install`. This gate runs scripts/e2e/gitops-golden-path.sh — the exact driver
# scripts/e2e/local/kind-gitops-run.sh validates locally — pointed at the PR's
# own commit so ArgoCD reads gitops/platform-addons from the branch under test.
# (kyverno.tf no longer holds the helm_release the old golden-path.sh scraped, so
# that direct-apply driver is a local-only lane now; CI proves the GitOps path.)
#
# What it proves, for $0, before any A-stage (ownership inversion) touches real
# infrastructure:
#   1. ArgoCD renders + syncs the Kyverno + aegis-policies Applications from git
#      (the ownership inversion), and the ClusterPolicies stand up (golden path).
#   2. require-image-digest in Enforce mode REJECTS a tag-only Pod in an aegis-*
#      namespace (the Enforce flip is a HARNESS-LOCAL overlay — platform default
#      stays Audit; see golden-path.sh header + epic #167 open-decision 8).
#   3. The generated default-deny NetworkPolicy ACTUALLY blocks cross-namespace
#      traffic (needs a policy-enforcing CNI — kindnet does not enforce, so this
#      workflow installs Calico; k3s enforces natively — see scripts/e2e/kind/).
#   4. `kyverno test` (BVA unit tests) is green against the aegis-policies chart.
#   5. B2 (#171): a sample workload onboards through the workload ApplicationSet
#      (List generator + per-workload/per-account templatePatch injections, a
#      faithful port of argocd.tf) — the rendered Application reaches Synced +
#      Healthy pulling a digest-pinned image from an in-cluster registry:2, the
#      injections land, and a tag-only workload variant is denied. This golden
#      path is the acceptance gate the A5 ApplicationSet migration reuses.
#
# No AWS: this workflow declares NO id-token permission and assumes NO AWS role.

on:
  pull_request:
    branches: [main]
    paths:
      # Scope to the harness + the policies it exercises — the kind spin-up +
      # Calico + image pulls take several minutes.
      - "scripts/e2e/**"
      - "gitops/platform-addons/**"
      - "terraform/modules/regional-stack/charts/aegis-policies/**"
      # B2 (#171): the sample workload fixture + its registries catalog.
      - "fixtures/sample-deploy/**"
      - "sample-registries.json"
      - ".github/workflows/e2e-golden-path.yml"
  workflow_dispatch: {}

# No id-token / no AWS. Read-only checkout is all this gate needs.
permissions:
  contents: read

jobs:
  golden-path:
    name: kind-golden-path-e2e
    runs-on: ubuntu-latest
    # Hard ceiling so a stuck image-pull / wait can never hang a runner.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      # kind on a pinned node image + digest (same pin as
      # crossplane-kind-integration.yml). Default CNI is DISABLED via the config
      # so Calico can own NetworkPolicy enforcement (kindnet does not enforce it).
      - name: create kind cluster (default CNI off, Calico owns it)
        uses: helm/kind-action@v1.14.0
        with:
          cluster_name: aegis-e2e
          node_image: kindest/node:v1.32.11@sha256:5fc52d52a7b9574015299724bd68f183702956aa4a2116ae75a63cb574b35af8
          config: scripts/e2e/kind/kind-calico.yaml
          # wait=0: do NOT wait for node Ready at create time. With the default
          # CNI disabled the node stays NotReady until Calico is installed in the
          # next step, so a create-time readiness wait would always time out. The
          # readiness gate lives in the Calico step instead.
          wait: "0s"

      # Calico — the NetworkPolicy-enforcing CNI the default-deny negative test
      # needs. Pinned manifest. Wait until the datapath is actually up (calico-node
      # Ready → nodes Ready → coredns Ready) before running anything.
      - name: install Calico (NetworkPolicy-enforcing CNI)
        run: |
          kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.28.2/manifests/calico.yaml
          kubectl -n kube-system rollout status daemonset/calico-node --timeout=300s
          kubectl wait --for=condition=Ready nodes --all --timeout=180s
          kubectl -n kube-system rollout status deployment/coredns --timeout=180s

      # B2 (#171): stand up the local registry:2 the sample workload pulls from
      # (stands in for ECR on kind). The kind cluster's containerd is already
      # configured to mirror localhost:5000 -> kind-registry:5000
      # (scripts/e2e/kind/kind-calico.yaml). Seed the fixture's digest-pinned image
      # with `crane copy` (digest preserved), so localhost:5000/aegis-sample@sha256
      # resolves in-cluster. crane is fetched by the helper (no global install).
      - name: local registry — start, join kind net, seed sample image (B2)
        run: |
          source scripts/e2e/b2/local-registry.sh
          registry_up aegis-e2e
          registry_seed "busybox:1.37@sha256:9532d8c39891ca2ecde4d30d7710e01fb739c87a8b9299685c63704296b16028" aegis-sample

      - name: install Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.4

      # Kyverno CLI for `kyverno test` (Check 4). Version tracks the kyverno chart
      # the kyverno Application pins (gitops/platform-addons/addons/kyverno/
      # application.yaml → 3.2.x → Kyverno 1.12.x) so the test schema matches.
      - name: install kyverno CLI
        run: |
          ver=v1.12.6
          curl -sSL "https://github.com/kyverno/kyverno/releases/download/${ver}/kyverno-cli_${ver}_linux_x86_64.tar.gz" \
            | tar -xz -C /tmp kyverno
          sudo install -m 0755 /tmp/kyverno /usr/local/bin/kyverno
          kyverno version

      # yq (mikefarah v4) — gitops-golden-path.sh uses it to rewrite the root
      # Application's repoURL/targetRevision at seed time. Pinned for determinism
      # rather than relying on the runner image shipping it.
      - name: install yq
        run: |
          ver=v4.44.3
          sudo curl -sSL -o /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/${ver}/yq_linux_amd64"
          sudo chmod 0755 /usr/local/bin/yq
          yq --version

      # Stage 1: bring up the golden path VIA GITOPS (the A2 ownership inversion) —
      # seed only the app-of-apps root and let ArgoCD sync Kyverno (wave 0) then
      # aegis-policies (wave 1). Point ArgoCD at THIS PR's commit on the public
      # repo (gitops/platform-addons does not exist on main yet), exactly as the
      # local runner points it at a served worktree. Enforce overlay is applied by
      # the driver (harness-local; platform default stays Audit). kind's kubeconfig
      # is the default context.
      - name: golden path — ArgoCD-delivered Kyverno + aegis-policies (GitOps)
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          # PR head commit (pushed + clonable); fall back to the run's own sha for
          # workflow_dispatch. NOT github.sha on a PR (that is the merge ref).
          TARGET_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ./scripts/e2e/gitops-golden-path.sh

      # Stage 2 negatives.
      - name: negative — require-digest denies a tag-only pod
        run: ./scripts/e2e/negative/assert-require-digest.sh

      - name: negative — default-deny NetworkPolicy blocks cross-ns traffic
        run: ./scripts/e2e/negative/assert-default-deny.sh

      # A4 (#176): the Argo Rollouts controller now arrives via ArgoCD (the
      # app-of-apps root enumerates addons/argo-rollouts, sync-wave 0). Prove the
      # #176 gate: the Rollout CRD is Established BEFORE a Rollout-shaped workload
      # is admitted (no race). No env — reads the same seeded root as the stages
      # above; the argo-rollouts child is already synced by the golden-path seed.
      - name: A4 — argo-rollouts CRD established before workload sync (GitOps)
        run: ./scripts/e2e/assert-argo-rollouts.sh

      # B2 (#171): onboard a sample workload through the workload ApplicationSet
      # (List generator + per-workload/per-account templatePatch injections) — a
      # faithful port of argocd.tf. Proves the Application reaches Synced+Healthy,
      # the injections land, and a tag-only workload variant is denied. This golden
      # path is the acceptance gate A5 (migrate the workload ApplicationSet) reuses.
      - name: B2 — sample workload onboarding via ApplicationSet fan-out
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          TARGET_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ./scripts/e2e/b2/assert-workload-onboarding.sh

      # A6 (#178): prove the ephemeral/full PROFILE GATE. Runs LAST and is fully
      # hermetic — it registers a synthetic facts-bridge cluster Secret pointing at
      # an unreachable server, so the ALB controller + external-dns Applications are
      # GENERATED (profile=full) / excluded (profile=ephemeral) without any chart
      # ever syncing onto this kind cluster, then tears its fixtures down.
      - name: A6 — ephemeral/full profile gates ALB controller + external-dns
        run: ./scripts/e2e/assert-ephemeral-profile.sh

      # Offline BVA unit tests (also wired into scripts/verify/static-checks.sh
      # Check 4, which now stops skipping because tests/ exists).
      - name: kyverno test — aegis-policies BVA unit tests
        run: kyverno test terraform/modules/regional-stack/charts/aegis-policies/tests
