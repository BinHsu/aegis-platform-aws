# Grafana Alloy — migrated from Terraform helm_release.alloy to GitOps
# (ADR-25 / epic #167 A1). Delivered as an ApplicationSet, not a plain
# Application, because it is the consumer of the FACTS BRIDGE (epic #167 D3):
#
#   Terraform writes an in-cluster ArgoCD `cluster` Secret carrying cluster
#   facts as annotations (gitops-bootstrap.tf :: kubernetes_secret
#   .argocd_cluster_facts). The `clusters` generator below selects that Secret
#   and surfaces its annotations to the template, which injects them as env
#   vars. The git manifest therefore stays cluster-agnostic: cluster identity
#   (name, region) comes from the cluster, never hardcoded here.
#
# The River config was `alloy-config.river.tpl`, rendered by Terraform
# templatefile() with ${cluster_name}/${region}. Those two — the ONLY
# per-cluster values — are now `sys.env("CLUSTER_NAME")` / `sys.env("REGION")`,
# fed by extraEnv from the facts bridge. Everything else is identical to the
# pre-migration chart values (chart alloy 0.10.1, DaemonSet on host network,
# OTLP :4317 + Pyroscope :4040, public-preview stability, GC creds via envFrom).
#
# Grafana Cloud creds: the `grafana-cloud-credentials` Secret is TF-written into
# the monitoring namespace (epic #167 D4 — creds never live in git); this
# manifest only references it by name via envFrom.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: alloy
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    # Facts bridge: select the TF-written in-cluster `cluster` Secret. Its
    # annotations (aegis.binhsu.org/cluster-name, /region, /profile) become
    # template values below. The observability label gates fan-out: Terraform
    # sets it "true" only when it also wrote the prerequisites (monitoring ns +
    # grafana-cloud-credentials Secret, enable_observability=true). On clusters
    # without the facts Secret or with observability "false" — e.g. the B1/A2
    # e2e harness — this generates NOTHING, so the shared golden-path gate never
    # sees a half-configured observability stack.
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
            aegis.binhsu.org/observability: "true"
  template:
    metadata:
      name: "alloy-{{.nameNormalized}}"
    spec:
      project: default
      source:
        repoURL: https://grafana.github.io/helm-charts
        chart: alloy
        targetRevision: 0.10.1
        helm:
          valuesObject:
            controller:
              # DaemonSet on the host network — one Alloy per node so app pods
              # reach the OTLP (4317) + Pyroscope (4040) receivers directly at
              # $(NODE_IP):<port> without crossing a Service. dnsPolicy keeps
              # in-cluster DNS working for apiserver / cAdvisor scrapes.
              type: daemonset
              hostNetwork: true
              dnsPolicy: ClusterFirstWithHostNet
            alloy:
              # pyroscope.receive_http is public-preview; lower the minimum so
              # the Pyroscope receive/write path loads.
              stabilityLevel: public-preview
              # FACTS BRIDGE consumption: cluster identity injected from the
              # in-cluster `cluster` Secret annotations. The River config reads
              # these via sys.env(); they replace the old templatefile() vars.
              extraEnv:
                - name: CLUSTER_NAME
                  value: '{{index .metadata.annotations "aegis.binhsu.org/cluster-name"}}'
                - name: REGION
                  value: '{{index .metadata.annotations "aegis.binhsu.org/region"}}'
              # GC credentials — TF-written Secret in the monitoring ns (D4).
              envFrom:
                - secretRef:
                    name: grafana-cloud-credentials
              # Host ports for OTLP gRPC (4317) and Pyroscope (4040).
              extraPorts:
                - name: otlp-grpc
                  port: 4317
                  targetPort: 4317
                  protocol: TCP
                - name: pyroscope
                  port: 4040
                  targetPort: 4040
                  protocol: TCP
              configMap:
                create: true
                # River config — static in git. The only per-cluster values
                # (cluster/region labels) come from sys.env(CLUSTER_NAME/REGION),
                # set by extraEnv above from the facts bridge. GC endpoints +
                # token come from the envFrom Secret (MIMIR_URL, API_TOKEN, ...).
                content: |
                  // ==================================================================
                  // Discovery
                  // ==================================================================
                  discovery.kubernetes "pods" {
                    role = "pod"
                  }

                  discovery.kubernetes "nodes" {
                    role = "node"
                  }

                  discovery.kubernetes "services" {
                    role = "service"
                  }

                  discovery.relabel "node_exporter" {
                    targets = discovery.kubernetes.pods.targets

                    rule {
                      source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_label_app_kubernetes_io_name"]
                      regex         = "monitoring;prometheus-node-exporter"
                      action        = "keep"
                    }
                  }

                  discovery.relabel "kube_state_metrics" {
                    targets = discovery.kubernetes.pods.targets

                    rule {
                      source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_label_app_kubernetes_io_name"]
                      regex         = "monitoring;kube-state-metrics"
                      action        = "keep"
                    }
                  }

                  discovery.relabel "cadvisor" {
                    targets = discovery.kubernetes.nodes.targets

                    rule {
                      target_label = "__address__"
                      replacement  = "kubernetes.default.svc:443"
                    }

                    rule {
                      source_labels = ["__meta_kubernetes_node_name"]
                      regex         = "(.+)"
                      target_label  = "__metrics_path__"
                      replacement   = "/api/v1/nodes/$1/proxy/metrics/cadvisor"
                    }
                  }

                  // ==================================================================
                  // Scrape jobs -> forward to remote_write
                  // ==================================================================
                  prometheus.scrape "node_exporter" {
                    targets    = discovery.relabel.node_exporter.output
                    forward_to = [prometheus.relabel.infra_keep.receiver]
                    job_name   = "node-exporter"
                  }

                  prometheus.scrape "kube_state_metrics" {
                    targets    = discovery.relabel.kube_state_metrics.output
                    forward_to = [prometheus.relabel.infra_keep.receiver]
                    job_name   = "kube-state-metrics"
                  }

                  prometheus.scrape "cadvisor" {
                    targets         = discovery.relabel.cadvisor.output
                    forward_to      = [prometheus.relabel.infra_keep.receiver]
                    job_name        = "cadvisor"
                    scheme          = "https"
                    bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
                    tls_config {
                      insecure_skip_verify = true
                    }
                  }

                  prometheus.scrape "apiserver" {
                    targets = [
                      { __address__ = "kubernetes.default.svc:443" },
                    ]
                    forward_to        = [prometheus.relabel.apiserver_keep.receiver]
                    job_name          = "apiserver"
                    scheme            = "https"
                    bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
                    tls_config {
                      ca_file = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
                    }
                  }

                  // ==================================================================
                  // Cardinality guards — keep-lists before remote_write.
                  // ==================================================================
                  prometheus.relabel "infra_keep" {
                    forward_to = [prometheus.relabel.add_labels.receiver]

                    rule {
                      source_labels = ["__name__"]
                      regex         = "up|node_cpu_seconds_total|node_memory_(MemTotal|MemAvailable)_bytes|container_memory_working_set_bytes|kube_deployment_(status_replicas_ready|spec_replicas)|kube_pod_container_resource_limits"
                      action        = "keep"
                    }
                  }

                  prometheus.relabel "apiserver_keep" {
                    forward_to = [prometheus.relabel.add_labels.receiver]

                    rule {
                      source_labels = ["__name__"]
                      regex         = "up|apiserver_request_total"
                      action        = "keep"
                    }
                  }

                  // Inject cluster + region labels onto every metric. Values come
                  // from the facts bridge via extraEnv (CLUSTER_NAME / REGION).
                  prometheus.relabel "add_labels" {
                    forward_to = [prometheus.remote_write.mimir.receiver]

                    rule {
                      target_label = "cluster"
                      replacement  = sys.env("CLUSTER_NAME")
                    }

                    rule {
                      target_label = "region"
                      replacement  = sys.env("REGION")
                    }
                  }

                  // ==================================================================
                  // OTLP receiver — app SDK pushes metrics + traces here.
                  // ==================================================================
                  otelcol.receiver.otlp "default" {
                    grpc {
                      endpoint = "0.0.0.0:4317"
                    }

                    output {
                      metrics = [otelcol.processor.batch.default.input]
                      traces  = [otelcol.processor.batch.default.input]
                    }
                  }

                  otelcol.processor.batch "default" {
                    output {
                      metrics = [otelcol.exporter.prometheus.app.input]
                      traces  = [otelcol.exporter.otlp.tempo.input]
                    }
                  }

                  otelcol.exporter.prometheus "app" {
                    resource_to_telemetry_conversion = true
                    forward_to                       = [prometheus.relabel.add_labels.receiver]
                  }

                  otelcol.exporter.otlp "tempo" {
                    client {
                      endpoint = sys.env("TEMPO_URL")
                      auth     = otelcol.auth.basic.tempo.handler
                    }
                  }

                  otelcol.auth.basic "tempo" {
                    username = sys.env("TEMPO_USERNAME")
                    password = sys.env("API_TOKEN")
                  }

                  // ==================================================================
                  // Logs — discover pods, tail container stdout, ship to Loki.
                  // ==================================================================
                  loki.source.kubernetes "pods" {
                    targets    = discovery.kubernetes.pods.targets
                    forward_to = [loki.process.add_labels.receiver]
                  }

                  loki.process "add_labels" {
                    forward_to = [loki.write.default.receiver]

                    stage.json {
                      expressions = {
                        level    = "level",
                        msg      = "msg",
                        trace_id = "trace_id",
                        span_id  = "span_id",
                      }
                    }

                    stage.labels {
                      values = {
                        level    = "level",
                        trace_id = "trace_id",
                      }
                    }

                    stage.static_labels {
                      values = {
                        cluster = sys.env("CLUSTER_NAME"),
                        region  = sys.env("REGION"),
                      }
                    }
                  }

                  loki.write "default" {
                    endpoint {
                      url = sys.env("LOKI_URL")
                      basic_auth {
                        username = sys.env("LOKI_USERNAME")
                        password = sys.env("API_TOKEN")
                      }
                    }
                  }

                  // ==================================================================
                  // Pyroscope — receive HTTP from pyroscope-go SDK, forward to cloud.
                  // ==================================================================
                  pyroscope.receive_http "default" {
                    http {
                      listen_address = "0.0.0.0"
                      listen_port    = 4040
                    }
                    forward_to = [pyroscope.write.default.receiver]
                  }

                  pyroscope.write "default" {
                    endpoint {
                      url = sys.env("PYROSCOPE_URL")
                      basic_auth {
                        username = sys.env("PYROSCOPE_USERNAME")
                        password = sys.env("API_TOKEN")
                      }
                    }
                    external_labels = {
                      cluster = sys.env("CLUSTER_NAME"),
                      region  = sys.env("REGION"),
                    }
                  }

                  // ==================================================================
                  // Mimir remote_write — terminus for all Prometheus-format metrics.
                  // ==================================================================
                  prometheus.remote_write "mimir" {
                    endpoint {
                      url = sys.env("MIMIR_URL")
                      basic_auth {
                        username = sys.env("MIMIR_USERNAME")
                        password = sys.env("API_TOKEN")
                      }
                    }
                  }
      destination:
        server: "{{.server}}"
        namespace: monitoring
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          # monitoring ns is Terraform-owned (privileged PSS + GC creds Secret).
          - CreateNamespace=false
