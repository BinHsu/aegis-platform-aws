# prometheus-node-exporter — migrated from Terraform helm_release.node_exporter
# (ADR-25 / epic #167 A1). Alloy scrapes it (see the node_exporter relabel in
# the Alloy River config). No per-cluster values, but delivered as an
# ApplicationSet anyway: the clusters generator's observability label acts as
# the fan-out GATE (same as addons/alloy/application.yaml) — on clusters where
# Terraform did not write the monitoring namespace + creds (harness clusters,
# enable_observability=false), nothing generates, so no Application ever points
# at a namespace that does not exist. Runs in the TF-owned monitoring namespace
# (privileged PSS: node-exporter uses hostPath / hostNetwork and would be
# rejected by a restricted namespace).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: prometheus-node-exporter
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
            aegis.binhsu.org/observability: "true"
  template:
    metadata:
      name: "prometheus-node-exporter-{{.nameNormalized}}"
    spec:
      project: default
      source:
        repoURL: https://prometheus-community.github.io/helm-charts
        chart: prometheus-node-exporter
        targetRevision: 4.41.0
        helm:
          valuesObject:
            service:
              port: 9100
      destination:
        server: "{{.server}}"
        namespace: monitoring
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          # monitoring ns is Terraform-owned (privileged PSS + GC creds Secret).
          - CreateNamespace=false
