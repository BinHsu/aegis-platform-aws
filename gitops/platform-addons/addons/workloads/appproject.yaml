# gitops/platform-addons/addons/workloads/appproject.yaml
#
# Workload AppProject — MIGRATED FROM TERRAFORM (epic #167 A5 / issue #177,
# ADR-25 ownership inversion). Was terraform/modules/regional-stack/argocd.tf ::
# helm_release.argocd_apps (projects.aegis-workloads); now a git-resident manifest
# the app-of-apps root applies via directory.recurse (like every other add-on).
#
# ── ENFORCEMENT FOUR-PACK #1 — namespace-squatting defense (verbatim from the
#    old TF AppProject) ────────────────────────────────────────────────────────
# ONE shared AppProject, not one per workload. ArgoCD cannot GENERATE an
# AppProject from an ApplicationSet, so per-workload projects would re-introduce a
# platform PR per onboard — defeating self-service. The squatting wall is instead:
#   (a) the ApplicationSet DERIVES each app's destination namespace from the repo
#       name (a deploy repo cannot pick its own namespace — the value comes from
#       the discovered repo, not from anything inside it), backed by
#   (b) this project's destination allowlist (aegis-* only), and
#   (c) sourceRepos pinned to the org (below).
#
# ── WHY THIS IS GIT-STATIC (no facts bridge) ─────────────────────────────────
# An AppProject is a plain resource, not an ApplicationSet, so it cannot read the
# in-cluster facts Secret. Its only per-install variable in the old TF form was
# sourceRepos = https://github.com/<github_owner>/* — and github_owner is a PUBLIC
# GitHub handle, not an account-bound secret, so hardcoding the production default
# here is consistent with root-app.yaml / the crossplane + argo-rollouts children
# (all of which hardcode https://github.com/BinHsu/... as the production default,
# and Terraform overrides repoURL only where it seeds an Application). A FORK
# changes the owner below (one line), the same edit a fork makes to root-app.yaml.
#
# REVERT: `git revert` restores helm_release.argocd_apps in argocd.tf (this
# AppProject + the ApplicationSet). Single logical boundary with the ApplicationSet.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: aegis-workloads
  namespace: argocd
  annotations:
    # Create the AppProject ahead of the ApplicationSet that references it. The
    # ApplicationSet + its generated Applications ride a later wave (see
    # applicationset.yaml); a project must exist before an app names it.
    argocd.argoproj.io/sync-wave: "2"
spec:
  description: >-
    All aegis-workload deploy repos. Destinations locked to aegis-* namespaces;
    sources locked to the org; cluster-scoped kinds limited to Namespace.
    ADR-07 enforcement #1 (migrated from argocd.tf in A5, epic #167 / #177).
  # sourceRepos pinned to the org (ENFORCEMENT FOUR-PACK #1 (c)). Production
  # default owner — a fork changes it, same as root-app.yaml.
  sourceRepos:
    - "https://github.com/BinHsu/*"
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "aegis-*"
  # Namespace is the ONLY cluster-scoped kind a deploy repo may ship:
  # CreateNamespace=true makes the (cluster-scoped) workload namespace. Everything
  # else a workload ships is namespaced — ACK Role/Policy CRDs, and aegis-core's
  # audio-isolation policy (a namespaced kyverno Policy in ns aegis-core, NOT a
  # ClusterPolicy). Keeping cluster-scoped kinds to {Namespace} closes the hole
  # where any aegis-workloads repo could otherwise ship a cluster-wide Kyverno
  # ClusterPolicy — the destination allowlist (aegis-*) does NOT constrain
  # cluster-scoped resources, so this whitelist is the only wall.
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
