# scripts/e2e/b2/workload-applicationset.yaml
#
# B2 (epic #167 / ADR-26) — the workload AppProject + ApplicationSet the kind lane
# exercises. It is a FAITHFUL PORT of the now-GITOPS-RESIDENT production spec
# (gitops/platform-addons/addons/workloads/{appproject,applicationset}.yaml, which
# A5/#177 moved out of terraform/modules/regional-stack/argocd.tf): SAME template,
# SAME per-workload/per-account templatePatch conditionals, SAME sync-wave 3 +
# retry on the generated Application. Onboarding a sample workload through THIS is
# the acceptance gate A5 (migrate the workload ApplicationSet) must pass.
#
# ┌─ WHY A SEPARATE HARNESS COPY (was OPEN DECISION B2-a; A5 resolves it) ───────┐
# │ Production A5 delivers the workload ApplicationSet as a Matrix               │
# │ (clusters × list.elementsYaml) generator: Terraform writes the per-workload  │
# │ element list as the aegis.binhsu.org/workloads annotation on the in-cluster  │
# │ ArgoCD `cluster` Secret (facts bridge), and the git ApplicationSet reads it   │
# │ back. Driving the PRODUCTION manifest on kind would require seeding a         │
# │ secret-type=cluster Secret — which the app-of-apps root (already up in this   │
# │ golden path) would ALSO feed to the Crossplane ApplicationSets, waking a full │
# │ Crossplane install inside the fast B2 policy lane (out of B2's scope; that is │
# │ crossplane-kind-integration.yml's job). So this harness copy keeps a PLAIN    │
# │ list generator with the elements INJECTED by the driver                       │
# │ (assert-workload-onboarding.sh), exercising the identical template +          │
# │ templatePatch WITHOUT a facts Secret — the render is proven equivalent; the   │
# │ Matrix+elementsYaml DELIVERY is proven separately (see the A5 PR: local       │
# │ isolated render + rendered-Application diff). Keep template/templatePatch/     │
# │ sync-wave/retry below in EXACT lock-step with the production applicationset.   │
# │ NAMES are suffixed `-e2e` so this copy never collides with the production      │
# │ aegis-workloads objects the root creates (idle, no facts Secret) in this lane. │
# │ FOLLOW-UP for #145: a CI lane that drives the production Matrix+elementsYaml   │
# │ manifest end to end needs the B2 golden-path root to either exclude Crossplane │
# │ or accept its bring-up. Flagged in the A5 PR.                                  │
# └────────────────────────────────────────────────────────────────────────────┘
#
# HARNESS DEVIATIONS from the production manifest (kept minimal, marked HARNESS):
#   - generators is a plain list with elements a placeholder []; the driver injects
#     elements built from sample-registries.json via the same transform as
#     local.workload_list_elements. Production uses Matrix(clusters × elementsYaml).
#   - names carry an `-e2e` suffix (AppProject / ApplicationSet / project) so they
#     do not collide with the root-created production aegis-workloads objects.
#   - AppProject.sourceRepos is "*" (the harness serves the fixture from a local git
#     mirror / the repo's own PR commit, not github.com/<owner>/*).
#   - source.path + region + modelBucket ride the element (the driver sets them),
#     matching how Terraform now element-carries path/region into the bridge.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: aegis-workloads-e2e
  namespace: argocd
spec:
  description: >-
    HARNESS copy of the aegis-workloads AppProject (addons/workloads/appproject
    .yaml). Destinations locked to aegis-* namespaces; cluster-scoped kinds limited
    to Namespace. Named -e2e so it never collides with the root-created production
    project.
  # HARNESS: production pins sourceRepos to https://github.com/<owner>/*; the
  # harness reads the fixture from a local git mirror / the PR commit, so "*".
  sourceRepos:
    - "*"
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "aegis-*"
  # Namespace is the ONLY cluster-scoped kind a deploy repo may ship (matches
  # production: the destination allowlist does not constrain cluster-scoped
  # resources, so this whitelist is the wall).
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: aegis-workloads-e2e
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    # HARNESS: elements injected by assert-workload-onboarding.sh from
    # sample-registries.json (same transform as local.workload_list_elements).
    # Production uses a Matrix(clusters × list.elementsYaml) reading the facts
    # bridge; the resulting elements — and thus the rendered Application — are
    # identical.
    - list:
        elements: []
  template:
    metadata:
      name: "{{trimSuffix \"-deploy\" .repository}}"
      annotations:
        # A4 ordering fix (identical to production): the generated workload
        # Application rides a wave after the platform add-ons (argo-rollouts wave 0).
        argocd.argoproj.io/sync-wave: "3"
    spec:
      project: aegis-workloads-e2e
      source:
        repoURL: "{{.url}}"
        targetRevision: "{{.branch}}"
        # HARNESS: per-element path (fixtures co-located in one repo). Production
        # element-carries path too (Terraform sets it to k8s/overlays/<environment>).
        path: "{{.path}}"
        kustomize:
          # Always-on, per-workload/per-account injections (identical to production).
          commonAnnotations:
            # region injection — workload INTENT (region-aware workloads read it).
            "aegis.binhsu.org/region": "{{.region}}"
            # ECR account-ID hide — full repository URL, NO tag/digest (ADR-12).
            "aegis.binhsu.org/ecr-repository": "{{.ecrAccountId}}.dkr.ecr.{{.ecrRegion}}.amazonaws.com/{{trimSuffix \"-deploy\" .repository}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{trimSuffix \"-deploy\" .repository}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        # A4 residual backstop (identical to production): retry until the Rollout
        # CRD (argo-rollouts wave 0) is Established if a Rollout-shaped workload
        # races ahead of it.
        retry:
          limit: 15
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 3m
  # Conditional, account-bound injections — each keyed off an empty string so a
  # workload that declares neither renders nothing (verbatim from the production
  # applicationset.yaml / the old argocd.tf).
  templatePatch: |
    {{- if or .engineServiceAccount .certArn }}
    spec:
      source:
        kustomize:
          patches:
          {{- if .certArn }}
            - target:
                kind: Ingress
                name: {{ .ingressName }}
              patch: |-
                - op: add
                  path: /metadata/annotations/alb.ingress.kubernetes.io~1certificate-arn
                  value: {{ .certArn }}
          {{- end }}
          {{- if and .engineServiceAccount .modelBucket }}
            - target:
                kind: ConfigMap
                name: {{ trimSuffix "-deploy" .repository }}-model-store
              patch: |-
                - op: replace
                  path: /data/bucket
                  value: {{ .modelBucket }}
          {{- end }}
          {{- if and .engineServiceAccount .cognitoIssuer .cognitoAudience .cognitoJwks }}
            - target:
                kind: ConfigMap
                name: {{ trimSuffix "-deploy" .repository }}-gateway-oidc
              patch: |-
                - op: replace
                  path: /data/issuer
                  value: {{ .cognitoIssuer }}
                - op: replace
                  path: /data/audience
                  value: {{ .cognitoAudience }}
                - op: replace
                  path: /data/jwksUrl
                  value: {{ .cognitoJwks }}
          {{- end }}
    {{- end }}
